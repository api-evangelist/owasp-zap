# OWASP ZAP integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in owasp-zap-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: owasp-zap-github-marketplace-actions
  label: GitHub Marketplace (actions)
  partner: github-actions
  partner_name: GitHub Marketplace (actions)
  type: marketplace
  marketplace: github-actions
  channel: partner-built
  evidence: https://github.com/marketplace/actions/zap-full-scan
  source: edge
  relationship: platform-app
  status: not-a-workflow
  arazzo: null
- slug: owasp-zap-flathub
  label: Flathub
  partner_name: Flathub
  category: Linux desktop app (Flathub)
  type: marketplace
  marketplace: flathub
  channel: partner-built
  evidence: https://flathub.org/apps/org.zaproxy.ZAP
  source: edge
  relationship: platform-app
  contract_reference:
    register: 'Flathub (flathub.org/api/v2/appstream/<app-id>: developer_name, urls.homepage, flathub::verification::*)'
    spec_file: null
    role: flathub-verified-publisher
    registered_name: The ZAP Development Team
    register_id: https://flathub.org/api/v2/appstream/org.zaproxy.ZAP
    matched_domain: zaproxy.org
    matched_by: domain
    matched_name: ZAP
    verification_method: website
    verified_website: zaproxy.org
    app_id_domain: zaproxy.org
    signal_note: ONE edge per provider for the store; listing alone = participation. Only apps whose Flathub verification
      is a domain proof (website / dns) on the provider's own domain, with the reverse-DNS app id agreeing; app
      counts are context, never counted. Unverified (community repackage) and account-verified apps are held. No
      Flathub repo in all/*, so no platform-side edge exists to mirror.
    detected_by: sweep-flathub-linux-app-publishers.py
    detected: '2026-10-22'
  status: not-a-workflow
  arazzo: null
- slug: owasp-zap-openssf-best-practices-badge
  label: OpenSSF Best Practices Badge
  partner_name: OpenSSF Best Practices Badge
  category: OpenSSF Best Practices badge (open-source project security conformance)
  type: register
  channel: standard-directory
  evidence: https://www.bestpractices.dev/en/projects/24
  source: edge
  relationship: standard-participant
  contract_reference:
    register: OpenSSF Best Practices badge projects (bestpractices.dev/en/projects.json, paged)
    standard: OpenSSF Best Practices Badge criteria (formerly CII Best Practices; bestpractices.dev)
    spec_file: null
    role: badge-holder
    registered_name: Zed Attack Proxy (ZAP)
    matched_by: github-org
    matched_on: zaproxy
    certified_products:
    - product: open-source project
      product_type: open-source project
      standard: OpenSSF Best Practices Badge criteria (formerly CII Best Practices; bestpractices.dev)
      lapsed: false
      partner_tier: passing
      projects:
      - name: Zed Attack Proxy (ZAP)
        id: 24
        url: https://www.bestpractices.dev/en/projects/24
        badge_level: passing
