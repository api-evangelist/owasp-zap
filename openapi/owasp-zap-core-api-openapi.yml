      description: ''
      schema:
        type: string
    - name: isEnabled
      in: query
      description: ''
      schema:
        type: string
    get:
      description: Use the API endpoints in the 'network' component instead.
      deprecated: true
      operationId: coreActionAddProxyChainExcludedDomain
      tags:
      - core
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
  /JSON/core/action/clearExcludedFromProxy/:
