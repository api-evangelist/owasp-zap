  /JSON/ascan/action/scan/:
    parameters:
    - name: url
      in: query
      description: ''
      schema:
        type: string
    - name: recurse
      in: query
      description: ''
      schema:
        type: string
    - name: inScopeOnly
      in: query
      description: ''
      schema:
        type: string
    - name: scanPolicyName
      in: query
      description: ''
      schema:
        type: string
    - name: method
      in: query
      description: ''
      schema:
