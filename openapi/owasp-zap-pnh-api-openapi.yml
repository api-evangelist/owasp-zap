openapi: 3.0.3
info:
  title: ZAP accessControl pnh API
  description: The HTTP API for controlling and accessing ZAP.
  contact:
    name: ZAP User Group
    url: https://groups.google.com/group/zaproxy-users
    email: zaproxy-users@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.16.1
servers:
- url: http://zap
  description: The URL while proxying through ZAP.
- url: http://{address}:{port}
  description: The URL of a Local Proxy of ZAP.
  variables:
    address:
      description: The address ZAP is listening on.
      default: 127.0.0.1
    port:
      description: The port ZAP is bound to.
      default: '8080'
security:
- {}
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: pnh
paths:
  /JSON/pnh/action/monitor/:
    parameters:
    - name: id
      in: query
      required: true
      description: ''
      schema:
        type: string
    - name: message
      in: query
      required: true
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: pnhActionMonitor
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
  /JSON/pnh/action/oracle/:
    parameters:
    - name: id
      in: query
      required: true
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: pnhActionOracle
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
  /JSON/pnh/action/startMonitoring/:
    parameters:
    - name: url
      in: query
      required: true
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: pnhActionStartMonitoring
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
  /JSON/pnh/action/stopMonitoring/:
    parameters:
    - name: id
      in: query
      required: true
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: pnhActionStopMonitoring
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
  /OTHER/pnh/other/fx_pnh.xpi/:
    get:
      description: ''
      operationId: pnhOtherFx_pnh.xpi
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorOther'
  /OTHER/pnh/other/manifest/:
    get:
      description: ''
      operationId: pnhOtherManifest
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorOther'
  /OTHER/pnh/other/pnh/:
    get:
      description: ''
      operationId: pnhOtherPnh
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorOther'
  /OTHER/pnh/other/service/:
    get:
      description: ''
      operationId: pnhOtherService
      tags:
      - pnh
      responses:
        default:
          $ref: '#/components/responses/ErrorOther'
components:
  schemas:
    ErrorJson:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
  responses:
    ErrorJson:
      description: Error of JSON endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorJson'
    ErrorOther:
      description: Error of OTHER endpoints.
      content:
        '*/*': {}
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: X-ZAP-API-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: apikey
      in: query
