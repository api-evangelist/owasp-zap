openapi: 3.2.0
info:
  title: ZAP Postman API
  description: The HTTP API for controlling and accessing ZAP.
  contact:
    name: ZAP User Group
    url: https://groups.google.com/group/zaproxy-users
    email: zaproxy-users@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.16.1
servers:
- url: http://zap
  description: The URL while proxying through ZAP.
- url: http://{address}:{port}
  description: The URL of a Local Proxy of ZAP.
  variables:
    address:
      description: The address ZAP is listening on.
      default: 127.0.0.1
    port:
      description: The port ZAP is bound to.
      default: '8080'
security:
- {}
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: postman
paths:
  /JSON/postman/action/importFile/:
    parameters:
    - name: file
      in: query
      required: true
      description: ''
      schema:
        type: string
    - name: endpointUrl
      in: query
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: postmanActionImportFile
      tags:
      - postman
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
      summary: Postman action import file
      x-summary-source: derived
  /JSON/postman/action/importUrl/:
    parameters:
    - name: url
      in: query
      required: true
      description: ''
      schema:
        type: string
    - name: endpointUrl
      in: query
      description: ''
      schema:
        type: string
    get:
      description: ''
      operationId: postmanActionImportUrl
      tags:
      - postman
      responses:
        default:
          $ref: '#/components/responses/ErrorJson'
      summary: Postman action import url
      x-summary-source: derived
components:
  schemas:
    ErrorJson:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
  responses:
    ErrorJson:
      description: Error of JSON endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorJson'
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: X-ZAP-API-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: apikey
      in: query
